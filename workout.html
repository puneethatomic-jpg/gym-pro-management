<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Management - GYM PRO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">GP</div>
          <div class="brand-text">GYM <span>PRO</span></div>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="members.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
          <span class="nav-text">Members</span>
        </a>
        <a href="plans.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          <span class="nav-text">Plans / Membership</span>
        </a>
        <a href="payments.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          <span class="nav-text">Payments</span>
        </a>
        <a href="workout.html" class="nav-item active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M2 11v2M22 11v2"></path></svg>
          <span class="nav-text">Workout</span>
        </a>
        <a href="diet.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
          <span class="nav-text">Diet</span>
        </a>
        <a href="reports.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span class="nav-text">Reports</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="window.Auth.logout()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span class="logout-text">Logout</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="top-bar">
        <h1 id="pageTitle" class="page-title">Workout Schedule Management</h1>
        <div class="user-profile-badge">
          <div id="topBarAvatar" class="avatar">A</div>
          <div class="user-info-text">
            <div id="topBarUserName" class="user-name">Administrator</div>
            <div id="topBarUserRole" class="user-role">System Admin</div>
          </div>
        </div>
      </header>

      <div class="content-body">
        <div class="toolbar">
          <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="form-control" placeholder="Search by member name, day or exercise..." oninput="renderWorkouts()">
          </div>

          <button class="btn btn-primary" onclick="openWorkoutModal()">
            + Assign New Workout
          </button>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Member</th>
                  <th>Day</th>
                  <th>Workout Plan & Exercises</th>
                  <th>Target Duration</th>
                  <th style="text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody id="workoutsTableBody">
                <!-- Dynamically Populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- WORKOUT MODAL -->
  <div id="workoutModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="workoutModalTitle" class="modal-title">Assign Member Workout</h3>
        <button class="close-modal" onclick="closeWorkoutModal()">&times;</button>
      </div>

      <form id="workoutForm">
        <input type="hidden" id="workoutId">

        <div class="form-group">
          <label class="form-label" for="wMember">Select Member</label>
          <select id="wMember" class="form-control" required>
            <!-- Options populated dynamically -->
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="wDay">Day of Week</label>
            <select id="wDay" class="form-control" required>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="wDuration">Duration</label>
            <input type="text" id="wDuration" class="form-control" placeholder="e.g. 60 mins" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="wExercise">Exercise Routine Details</label>
          <textarea id="wExercise" class="form-control" rows="4" placeholder="e.g. Chest & Triceps: Bench Press 4x10, Dumbbell Flyes 3x12, Tricep Dips 3x15..." required></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn btn-secondary" onclick="closeWorkoutModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Workout Assignment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    window.Auth.requireAdmin();
    window.Auth.updateTopBar('Workout Management');

    function renderWorkouts() {
      const workouts = window.DB.get(window.DB.KEYS.WORKOUTS);
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = workouts.filter(w =>
        (w.member || '').toLowerCase().includes(query) ||
        (w.day || '').toLowerCase().includes(query) ||
        (w.workout || '').toLowerCase().includes(query)
      );

      const tbody = document.getElementById('workoutsTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No workout assignments found</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(w => `
        <tr>
          <td><strong>${w.member}</strong></td>
          <td><span class="badge badge-active">${w.day}</span></td>
          <td style="max-width: 400px;">${w.workout}</td>
          <td>${w.duration}</td>
          <td style="text-align: right;">
            <button class="btn btn-secondary btn-sm" onclick="editWorkout('${w.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteWorkout('${w.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function openWorkoutModal() {
      const members = window.DB.get(window.DB.KEYS.MEMBERS);
      const select = document.getElementById('wMember');

      if (members.length === 0) {
        alert('Please register members first before assigning workouts.');
        return;
      }

      select.innerHTML = members.map(m => `<option value="${m.name}">${m.name} (${m.plan})</option>`).join('');
      document.getElementById('workoutForm').reset();
      document.getElementById('workoutId').value = '';
      document.getElementById('workoutModalTitle').textContent = 'Assign New Workout';
      document.getElementById('workoutModal').classList.add('show');
    }

    function editWorkout(id) {
      const workouts = window.DB.get(window.DB.KEYS.WORKOUTS);
      const w = workouts.find(item => item.id === id);
      if (!w) return;

      openWorkoutModal();
      document.getElementById('workoutId').value = w.id;
      document.getElementById('workoutModalTitle').textContent = 'Edit Workout Assignment';
      document.getElementById('wMember').value = w.member;
      document.getElementById('wDay').value = w.day;
      document.getElementById('wDuration').value = w.duration;
      document.getElementById('wExercise').value = w.workout;
    }

    function closeWorkoutModal() {
      document.getElementById('workoutModal').classList.remove('show');
    }

    function deleteWorkout(id) {
      if (confirm('Delete this workout assignment?')) {
        let workouts = window.DB.get(window.DB.KEYS.WORKOUTS);
        workouts = workouts.filter(w => w.id !== id);
        window.DB.set(window.DB.KEYS.WORKOUTS, workouts);
        renderWorkouts();
      }
    }

    document.getElementById('workoutForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const id = document.getElementById('workoutId').value;
      let workouts = window.DB.get(window.DB.KEYS.WORKOUTS);

      const wObj = {
        id: id || 'w_' + Date.now(),
        member: document.getElementById('wMember').value,
        day: document.getElementById('wDay').value,
        duration: document.getElementById('wDuration').value.trim(),
        workout: document.getElementById('wExercise').value.trim()
      };

      if (id) {
        const idx = workouts.findIndex(item => item.id === id);
        if (idx !== -1) workouts[idx] = wObj;
      } else {
        workouts.push(wObj);
      }

      window.DB.set(window.DB.KEYS.WORKOUTS, workouts);
      closeWorkoutModal();
      renderWorkouts();
    });

    renderWorkouts();
  </script>
</body>
</html>
