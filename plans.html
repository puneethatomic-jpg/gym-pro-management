<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Plans - GYM PRO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">GP</div>
          <div class="brand-text">GYM <span>PRO</span></div>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="members.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
          <span class="nav-text">Members</span>
        </a>
        <a href="plans.html" class="nav-item active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          <span class="nav-text">Plans / Membership</span>
        </a>
        <a href="payments.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          <span class="nav-text">Payments</span>
        </a>
        <a href="workout.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M2 11v2M22 11v2"></path></svg>
          <span class="nav-text">Workout</span>
        </a>
        <a href="diet.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
          <span class="nav-text">Diet</span>
        </a>
        <a href="reports.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span class="nav-text">Reports</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="window.Auth.logout()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span class="logout-text">Logout</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="top-bar">
        <h1 id="pageTitle" class="page-title">Membership Plans</h1>
        <div class="user-profile-badge">
          <div id="topBarAvatar" class="avatar">A</div>
          <div class="user-info-text">
            <div id="topBarUserName" class="user-name">Administrator</div>
            <div id="topBarUserRole" class="user-role">System Admin</div>
          </div>
        </div>
      </header>

      <div class="content-body">
        <div class="toolbar">
          <h2 style="font-size: 18px; font-weight: 700;">Active Membership Offerings</h2>
          <button class="btn btn-primary" onclick="openAddPlanModal()">
            + Create New Plan
          </button>
        </div>

        <div id="plansGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;">
          <!-- Dynamically Populated Plan Cards -->
        </div>
      </div>
    </main>
  </div>

  <!-- ADD / EDIT PLAN MODAL -->
  <div id="planModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="planModalTitle" class="modal-title">Create Membership Plan</h3>
        <button class="close-modal" onclick="closePlanModal()">&times;</button>
      </div>

      <form id="planForm">
        <input type="hidden" id="planId">

        <div class="form-group">
          <label class="form-label" for="pName">Plan Name</label>
          <input type="text" id="pName" class="form-control" placeholder="e.g. Gold VIP Plan" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="pDuration">Duration</label>
            <input type="text" id="pDuration" class="form-control" placeholder="e.g. 3 Months" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="pPrice">Price (₹)</label>
            <input type="number" id="pPrice" class="form-control" placeholder="2499" required min="0">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="pDesc">Plan Description & Perks</label>
          <textarea id="pDesc" class="form-control" rows="3" placeholder="Describe features included in this membership..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="pStatus">Status</label>
          <select id="pStatus" class="form-control" required>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn btn-secondary" onclick="closePlanModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Plan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    window.Auth.requireAdmin();
    window.Auth.updateTopBar('Membership Plans');

    function renderPlans() {
      const plans = window.DB.get(window.DB.KEYS.PLANS);
      const container = document.getElementById('plansGrid');

      if (plans.length === 0) {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><h3>No plans defined</h3><p>Click "Create New Plan" to add membership options.</p></div>`;
        return;
      }

      container.innerHTML = plans.map(p => `
        <div class="card" style="margin-bottom: 0; display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
              <span class="badge ${ (p.status || 'Active').toLowerCase() === 'active' ? 'badge-active' : 'badge-inactive' }">${p.status || 'Active'}</span>
              <span style="font-size: 13px; color: var(--text-muted); font-weight: 500;">${p.duration}</span>
            </div>
            <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">${p.name}</h3>
            <div style="font-size: 32px; font-weight: 800; color: var(--accent-blue); margin-bottom: 16px;">
              ₹${Number(p.price).toLocaleString('en-IN')}
            </div>
            <p style="font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px;">
              ${p.description}
            </p>
          </div>
          <div style="display: flex; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 16px;">
            <button class="btn btn-secondary btn-sm" style="flex: 1;" onclick="editPlan('${p.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deletePlan('${p.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function openAddPlanModal() {
      document.getElementById('planForm').reset();
      document.getElementById('planId').value = '';
      document.getElementById('planModalTitle').textContent = 'Create Membership Plan';
      document.getElementById('planModal').classList.add('show');
    }

    function editPlan(id) {
      const plans = window.DB.get(window.DB.KEYS.PLANS);
      const plan = plans.find(p => p.id === id);
      if (!plan) return;

      document.getElementById('planId').value = plan.id;
      document.getElementById('planModalTitle').textContent = 'Edit Membership Plan';
      document.getElementById('pName').value = plan.name;
      document.getElementById('pDuration').value = plan.duration;
      document.getElementById('pPrice').value = plan.price;
      document.getElementById('pDesc').value = plan.description;
      document.getElementById('pStatus').value = plan.status || 'Active';

      document.getElementById('planModal').classList.add('show');
    }

    function closePlanModal() {
      document.getElementById('planModal').classList.remove('show');
    }

    function deletePlan(id) {
      if (confirm('Are you sure you want to delete this membership plan?')) {
        let plans = window.DB.get(window.DB.KEYS.PLANS);
        plans = plans.filter(p => p.id !== id);
        window.DB.set(window.DB.KEYS.PLANS, plans);
        renderPlans();
      }
    }

    document.getElementById('planForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const id = document.getElementById('planId').value;
      let plans = window.DB.get(window.DB.KEYS.PLANS);

      const planObj = {
        id: id || 'plan_' + Date.now(),
        name: document.getElementById('pName').value.trim(),
        duration: document.getElementById('pDuration').value.trim(),
        price: Number(document.getElementById('pPrice').value),
        description: document.getElementById('pDesc').value.trim(),
        status: document.getElementById('pStatus').value
      };

      if (id) {
        const idx = plans.findIndex(p => p.id === id);
        if (idx !== -1) plans[idx] = planObj;
      } else {
        plans.push(planObj);
      }

      window.DB.set(window.DB.KEYS.PLANS, plans);
      closePlanModal();
      renderPlans();
    });

    renderPlans();
  </script>
</body>
</html>
