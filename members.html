<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Management - GYM PRO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">GP</div>
          <div class="brand-text">GYM <span>PRO</span></div>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="members.html" class="nav-item active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span class="nav-text">Members</span>
        </a>
        <a href="plans.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          <span class="nav-text">Plans / Membership</span>
        </a>
        <a href="payments.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          <span class="nav-text">Payments</span>
        </a>
        <a href="workout.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M2 11v2M22 11v2"></path></svg>
          <span class="nav-text">Workout</span>
        </a>
        <a href="diet.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
          <span class="nav-text">Diet</span>
        </a>
        <a href="reports.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span class="nav-text">Reports</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="window.Auth.logout()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span class="logout-text">Logout</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="top-bar">
        <h1 id="pageTitle" class="page-title">Member Management</h1>
        <div class="user-profile-badge">
          <div id="topBarAvatar" class="avatar">A</div>
          <div class="user-info-text">
            <div id="topBarUserName" class="user-name">Administrator</div>
            <div id="topBarUserRole" class="user-role">System Admin</div>
          </div>
        </div>
      </header>

      <div class="content-body">
        <div class="toolbar">
          <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="form-control" placeholder="Search members by name, ID, phone..." oninput="renderMembers()">
          </div>

          <div style="display: flex; gap: 12px;">
            <select id="statusFilter" class="form-control" style="width: 150px;" onchange="renderMembers()">
              <option value="ALL">All Status</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
            <button class="btn btn-primary" onclick="openAddMemberModal()">
              + Add New Member
            </button>
          </div>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Member ID</th>
                  <th>Full Name</th>
                  <th>Contact</th>
                  <th>Plan</th>
                  <th>Weight</th>
                  <th>Status</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="membersTableBody">
                <!-- Dynamically Populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ADD / EDIT MEMBER MODAL -->
  <div id="memberModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle" class="modal-title">Add New Member</h3>
        <button class="close-modal" onclick="closeMemberModal()">&times;</button>
      </div>

      <form id="memberForm">
        <input type="hidden" id="memberIndex">
        
        <div class="form-group">
          <label class="form-label" for="mId">Member ID</label>
          <input type="text" id="mId" class="form-control" required readonly placeholder="MEM-101">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="mName">Full Name</label>
            <input type="text" id="mName" class="form-control" placeholder="e.g. John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="mAge">Age</label>
            <input type="number" id="mAge" class="form-control" placeholder="25" required min="10" max="100">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="mPhone">Phone Number</label>
            <input type="tel" id="mPhone" class="form-control" placeholder="9876543210" required pattern="[0-9]{10}">
          </div>
          <div class="form-group">
            <label class="form-label" for="mEmail">Email Address</label>
            <input type="email" id="mEmail" class="form-control" placeholder="john@example.com" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="mDob">Date of Birth</label>
            <input type="date" id="mDob" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="mWeight">Weight (kg)</label>
            <input type="number" id="mWeight" class="form-control" placeholder="70" required min="30" max="250">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="mPassword">Login Password</label>
          <input type="password" id="mPassword" class="form-control" placeholder="Set member login password" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="mPlan">Membership Plan</label>
            <select id="mPlan" class="form-control" required>
              <!-- Options populated dynamically from gymPlans -->
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="mStatus">Account Status</label>
            <select id="mStatus" class="form-control" required>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn btn-secondary" onclick="closeMemberModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Member</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    window.Auth.requireAdmin();
    window.Auth.updateTopBar('Member Management');

    function populatePlanSelectOptions() {
      const plans = window.DB.get(window.DB.KEYS.PLANS);
      const planSelect = document.getElementById('mPlan');
      planSelect.innerHTML = plans.map(p => `<option value="${p.name}">${p.name} (₹${p.price})</option>`).join('');
    }

    function renderMembers() {
      const members = window.DB.get(window.DB.KEYS.MEMBERS);
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const statusFilter = document.getElementById('statusFilter').value;

      const filtered = members.filter(m => {
        const matchesQuery = (m.name || '').toLowerCase().includes(query) ||
                             (m.id || '').toLowerCase().includes(query) ||
                             (m.phone || '').toLowerCase().includes(query) ||
                             (m.email || '').toLowerCase().includes(query);

        const matchesStatus = statusFilter === 'ALL' || (m.status || 'Active') === statusFilter;
        return matchesQuery && matchesStatus;
      });

      const tbody = document.getElementById('membersTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No matching members found</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((m, idx) => `
        <tr>
          <td><strong>${m.id || 'MEM-' + (100 + idx)}</strong></td>
          <td>
            <div style="font-weight: 600;">${m.name}</div>
            <div style="font-size: 12px; color: var(--text-muted);">${m.email}</div>
          </td>
          <td>${m.phone}</td>
          <td><span style="font-weight: 500; color: var(--accent-blue);">${m.plan || 'N/A'}</span></td>
          <td>${m.weight || '70'} kg</td>
          <td>
            <span class="badge ${ (m.status || 'Active').toLowerCase() === 'active' ? 'badge-active' : 'badge-inactive' }">
              ${m.status || 'Active'}
            </span>
          </td>
          <td style="text-align: right;">
            <button class="btn btn-secondary btn-sm" onclick="editMember('${m.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteMember('${m.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function openAddMemberModal() {
      populatePlanSelectOptions();
      document.getElementById('memberForm').reset();
      document.getElementById('memberIndex').value = '';
      document.getElementById('modalTitle').textContent = 'Add New Member';
      
      const members = window.DB.get(window.DB.KEYS.MEMBERS);
      const nextId = 'MEM-' + (101 + members.length);
      document.getElementById('mId').value = nextId;

      document.getElementById('memberModal').classList.add('show');
    }

    function editMember(id) {
      populatePlanSelectOptions();
      const members = window.DB.get(window.DB.KEYS.MEMBERS);
      const member = members.find(m => m.id === id);
      if (!member) return;

      document.getElementById('memberIndex').value = id;
      document.getElementById('modalTitle').textContent = 'Edit Member Profile';
      document.getElementById('mId').value = member.id;
      document.getElementById('mName').value = member.name;
      document.getElementById('mAge').value = member.age || 25;
      document.getElementById('mPhone').value = member.phone;
      document.getElementById('mEmail').value = member.email;
      document.getElementById('mDob').value = member.dob || '2000-01-01';
      document.getElementById('mWeight').value = member.weight || 70;
      document.getElementById('mPassword').value = member.password;
      document.getElementById('mPlan').value = member.plan;
      document.getElementById('mStatus').value = member.status || 'Active';

      document.getElementById('memberModal').classList.add('show');
    }

    function closeMemberModal() {
      document.getElementById('memberModal').classList.remove('show');
    }

    function deleteMember(id) {
      if (confirm('Are you sure you want to delete this member?')) {
        let members = window.DB.get(window.DB.KEYS.MEMBERS);
        members = members.filter(m => m.id !== id);
        window.DB.set(window.DB.KEYS.MEMBERS, members);
        renderMembers();
      }
    }

    document.getElementById('memberForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const idEdit = document.getElementById('memberIndex').value;
      let members = window.DB.get(window.DB.KEYS.MEMBERS);

      const memberObj = {
        id: document.getElementById('mId').value,
        name: document.getElementById('mName').value.trim(),
        age: Number(document.getElementById('mAge').value),
        phone: document.getElementById('mPhone').value.trim(),
        email: document.getElementById('mEmail').value.trim(),
        dob: document.getElementById('mDob').value,
        weight: Number(document.getElementById('mWeight').value),
        password: document.getElementById('mPassword').value.trim(),
        plan: document.getElementById('mPlan').value,
        status: document.getElementById('mStatus').value
      };

      if (idEdit) {
        // Edit existing
        const idx = members.findIndex(m => m.id === idEdit);
        if (idx !== -1) members[idx] = memberObj;
      } else {
        // Add new
        members.push(memberObj);
      }

      window.DB.set(window.DB.KEYS.MEMBERS, members);
      closeMemberModal();
      renderMembers();
    });

    renderMembers();
  </script>
</body>
</html>
