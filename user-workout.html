<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Workouts - GYM PRO</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .workout-day-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }

    .workout-day-card:hover {
      border-color: rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
    }

    .workout-day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .day-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-blue);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- MEMBER SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="user.html" class="brand-logo">
          <div class="brand-icon">GP</div>
          <div class="brand-text">GYM <span>PRO</span></div>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="user.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="user-profile.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span class="nav-text">My Profile</span>
        </a>
        <a href="user-membership.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          <span class="nav-text">Membership</span>
        </a>
        <a href="user-workout.html" class="nav-item active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M2 11v2M22 11v2"></path></svg>
          <span class="nav-text">My Workout</span>
        </a>
        <a href="user-diet.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
          <span class="nav-text">My Diet</span>
        </a>
        <a href="user-progress.html" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
          <span class="nav-text">My Progress</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="window.Auth.logout()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span class="logout-text">Logout</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="top-bar">
        <h1 id="pageTitle" class="page-title">My Assigned Workouts</h1>
        <div class="user-profile-badge">
          <div id="topBarAvatar" class="avatar">M</div>
          <div class="user-info-text">
            <div id="topBarUserName" class="user-name">Member Name</div>
            <div id="topBarUserRole" class="user-role">Plan</div>
          </div>
        </div>
      </header>

      <div class="content-body">
        <div id="workoutList">
          <!-- Dynamically Populated Cards -->
        </div>
      </div>
    </main>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const member = window.Auth.requireMember();
    window.Auth.updateTopBar('My Workouts');

    if (member) {
      const workouts = window.DB.get(window.DB.KEYS.WORKOUTS);
      const myWorkouts = workouts.filter(w => (w.member || '').toLowerCase() === member.name.toLowerCase());

      const container = document.getElementById('workoutList');
      if (myWorkouts.length === 0) {
        container.innerHTML = `
          <div class="card empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M2 11v2M22 11v2"></path></svg>
            <h3>No workouts assigned yet</h3>
            <p>Your gym instructor has not assigned a workout schedule to your profile yet.</p>
          </div>
        `;
      } else {
        const order = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        myWorkouts.sort((a, b) => order.indexOf(a.day) - order.indexOf(b.day));

        container.innerHTML = myWorkouts.map(w => `
          <div class="workout-day-card">
            <div class="workout-day-header">
              <span class="day-name">${w.day} Routine</span>
              <span class="badge badge-active">Target: ${w.duration}</span>
            </div>
            <p style="font-size: 15px; color: var(--text-main); line-height: 1.6;">
              ${w.workout}
            </p>
          </div>
        `).join('');
      }
    }
  </script>
</body>
</html>
